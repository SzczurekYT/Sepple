[package]
name = "sepple"
version.workspace = true
edition.workspace = true
license = "MIT"

default-run = "sepple"

[features]
wgpu = ["burn/wgpu"]
extra = ["dep:hound", "dep:clap", "dep:indicatif"]

[[bin]]
name = "sepple"
required-features = ["extra"]

[[bin]]
name = "shift_tester"
required-features = ["extra"]

[workspace]
members = ["zipa-model", "tester", "trainer"]

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
burn = { version = "~0.22.1", default-features = false, features = [
    "flex",
    "signal",
] }
burn-store = { version = "~0.22.1", default-features = false }
clap = { version = "4.6.1", features = ["derive"] }
indicatif = "0.18.6"
serde_json = "1.0.154"
phonetics-rs = "0.3.1"
unicode-segmentation = "1.13.3"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync"] }

[dependencies]
burn.workspace = true
burn-store.workspace = true
zipa-model = { path = "./zipa-model" }

hound = { version = "3.5.1", optional = true }
serde_json.workspace = true
cpal = { version = "0.18.2", features = ["pipewire"] }
unicode-segmentation.workspace = true
phonetics-rs.workspace = true
clap = { optional = true, workspace = true }
tokio.workspace = true
bunsen = { version = "0.41.0", default-features = false, features = ["store"] }
thiserror = "2.0.21"
directories = "6.0.0"
indicatif = { optional = true, workspace = true }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
tempfile = "3.27.0"

[package.metadata.cargo-machete.renamed]
phonetics-rs = "phonetics"

# Latest unreleased egui has a layout fix for ComboBox
[patch.crates-io]
egui = { git = "https://github.com/emilk/egui", branch = "main" }
egui-winit = { git = "https://github.com/emilk/egui", branch = "main" }
egui-wgpu = { git = "https://github.com/emilk/egui", branch = "main" }
egui_plot = { git = "https://github.com/emilk/egui_plot", branch = "main" }
emath = { git = "https://github.com/emilk/egui", branch = "main" }
eframe = { git = "https://github.com/emilk/egui", branch = "main" }

[profile.profiling]
inherits = "release"
debug = true
