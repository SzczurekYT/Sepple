[package]
name = "sepple"
version.workspace = true
edition.workspace = true

default-run = "sepple"

[features]
wgpu = ["burn/wgpu"]

[workspace]
members = ["multipa-model", "trainer"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
burn = { version = "~0.21", features = ["flex"] }
burn-store = "~0.21"
clap = { version = "4.6.1", features = ["derive"] }
indicatif = "0.18.6"
serde_json = "1.0.149"

[dependencies]
burn.workspace = true
burn-store.workspace = true
multipa-model = { path = "./multipa-model" }

hound = "3.5.1"
serde = { version = "1.0.220", features = ["derive"] }
serde_json.workspace = true
cpal = "0.18.2"
unicode-segmentation = "1.13.3"
phonetics-rs = "0.3.1"
clap.workspace = true
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "sync"] }
bunsen = { git = "https://github.com/zspacelabs/bunsen", default-features = false, features = [
    "store",
    "store_pytorch",
    "silero-weights",
] }
thiserror = "2.0.20"
directories = "6.0.0"
indicatif.workspace = true
reqwest = { version = "0.13.5", features = ["blocking"] }
tempfile = "3.27.0"
